name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --out azure-pim-activator.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: azure-pim-activator.vsix
          retention-days: 14
