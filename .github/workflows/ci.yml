name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Skip dependency install scripts; only run the one vsce needs for package signing.
      - run: npm ci --ignore-scripts && npm rebuild @vscode/vsce-sign

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --out azure-pim-activator.vsix

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: azure-pim-activator.vsix
          retention-days: 14
