name: Release

# Push a tag matching package.json's version to publish, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # trusted publishing (OIDC) to the VS Code Marketplace

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Skip dependency install scripts; only run the one vsce needs for package signing.
      - run: npm ci --ignore-scripts && npm rebuild @vscode/vsce-sign

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --out "azure-pim-activator-${VERSION}.vsix"

      - name: Publish to VS Code Marketplace
        # Uses the Marketplace trusted publishing policy for this repo/workflow; no PAT needed.
        run: npx vsce publish --oidc --packagePath "azure-pim-activator-${VERSION}.vsix"

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" "azure-pim-activator-${VERSION}.vsix" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details."
        env:
          GH_TOKEN: ${{ github.token }}
